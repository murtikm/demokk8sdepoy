name: CI-CD Pipeline

on:
  push:
    branches:
      - krishna

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push (with cache)
        run: |
          docker buildx build \
            --cache-from=type=registry,ref=${{ secrets.DOCKER_USERNAME }}/demo-app:cache \
            --cache-to=type=registry,ref=${{ secrets.DOCKER_USERNAME }}/demo-app:cache,mode=max \
            -f app/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/demo-app:latest \
            --push \
            app
