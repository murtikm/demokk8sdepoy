name: CI-CD Pipeline

on:
  push:
    branches:
      - krishna

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -f app/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }} \
            app

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}
